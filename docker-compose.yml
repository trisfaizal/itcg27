services:
  db:
    image: mysql:8.0
    container_name: itcg2027_mysql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: itcg_root_password2027
      MYSQL_DATABASE: itcg2027_db
      MYSQL_USER: itcg_user
      MYSQL_PASSWORD: itcg_password2027
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "itcg_user", "-pitcg_password2027"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - itcg-network

  web:
    build:
      context: .
      dockerfile: Dockerfile
      network: host
    container_name: itcg2027_web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "mysql://itcg_user:itcg_password2027@db:3306/itcg2027_db"
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      SESSION_SECRET: ${SESSION_SECRET}
      NODE_ENV: production
      PORT: 3000
    ports:
      - "3000:3000"
    volumes:
      - ./public/uploads:/app/public/uploads
    networks:
      - itcg-network

volumes:
  mysql_data:
    driver: local

networks:
  itcg-network:
    driver: bridge
